name: FullPrep CI/CD Pipeline

# ==============================================================================
# Production-Ready CI/CD Pipeline
# Triggers: Push to main/develop, Pull Requests to main/develop
# ==============================================================================

on:
  push:
    branches: [main, develop, dev-personal]
  pull_request:
    branches: [main, develop, dev-personal]

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/fullprep-frontend
  IMAGE_NAME_BACKEND: ${{ github.repository }}/fullprep-backend

jobs:
  # ==============================================================================
  # Job 1: Security & Dependency Vulnerability Scans
  # ==============================================================================
  security-scan:
    name: Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Run Trivy FS Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # Log high/critical vulns but do not block the build


      - name: Run npm audit (Frontend)
        run: |
          npm install --prefer-offline
          npm audit --audit-level=critical || true
        working-directory: ./frontend
        continue-on-error: true

      - name: Run npm audit (Backend)
        run: |
          npm install --prefer-offline
          npm audit --audit-level=critical || true
        working-directory: ./backend
        continue-on-error: true

  # ==============================================================================
  # Job 2: Code Quality (Lint & Type-Check)
  # ==============================================================================
  code-quality:
    name: Code Quality (Lint & Type-Check)
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # --- Frontend Checks ---
      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./frontend

      - name: Run Frontend Linter
        run: npm run lint
        working-directory: ./frontend

      - name: Run Frontend TypeScript Compiler Check
        run: npm run type-check
        working-directory: ./frontend

      # --- Backend Checks ---
      - name: Install Backend Dependencies
        run: npm install
        working-directory: ./backend

      - name: Run Backend Linter
        run: npm run lint
        working-directory: ./backend

  # ==============================================================================
  # Job 3: Unit Tests
  # ==============================================================================
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # --- Backend Unit Tests ---
      - name: Install Backend Dependencies
        run: npm install
        working-directory: ./backend

      - name: Run Backend Unit Tests (Native Test Runner)
        run: npm run test
        working-directory: ./backend

  # ==============================================================================
  # Job 4: Build Validation
  # ==============================================================================
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # --- Frontend Build check ---
      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./frontend

      - name: Build Frontend Application
        run: npm run build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
          # Sentry DSN and other build vars can be mocked here
          NEXT_PUBLIC_SENTRY_DSN: https://mock@mock.ingest.sentry.io/mock

  # ==============================================================================
  # Job 5: E2E Integration (Playwright Tests)
  # ==============================================================================
  e2e-integration:
    name: Playwright E2E & Integration Tests
    runs-on: ubuntu-latest
    needs: [build-validation]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Create Test Environment Configuration
        run: |
          cat > .env << EOF
          MONGO_ROOT_USERNAME=test_admin
          MONGO_ROOT_PASSWORD=test_admin_pass_123
          NODE_ENV=test
          JWT_SECRET=super_secret_jwt_key_for_testing_purposes_only_123
          ALLOWED_ORIGINS=http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api
          EOF

      - name: Start Compose Cluster (MongoDB, Redis, Backend, Frontend)
        run: |
          docker compose up -d --build || {
            echo "=== DOCKER CONTAINERS STATUS ==="
            docker compose ps
            echo "=== BACKEND LOGS ==="
            docker compose logs backend
            echo "=== FRONTEND LOGS ==="
            docker compose logs frontend
            exit 1
          }

      - name: Wait for Services to Be Healthy
        run: |
          echo "Waiting for services to initialize..."
          for i in {1..30}; do
            FRONTEND_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' fullprep-frontend || echo "unknown")
            BACKEND_STATUS=$(docker inspect --format='{{json .State.Health.Status}}' fullprep-backend || echo "unknown")
            echo "[Attempt $i] Frontend: $FRONTEND_STATUS, Backend: $BACKEND_STATUS"
            if [ "$FRONTEND_STATUS" = "\"healthy\"" ] && [ "$BACKEND_STATUS" = "\"healthy\"" ]; then
              echo "✅ Services are healthy!"
              break
            fi
            sleep 5
          done
          docker compose ps
          # Fail fast if services did not launch properly
          if [ "$(docker inspect --format='{{json .State.Health.Status}}' fullprep-frontend)" != "\"healthy\"" ] || \
             [ "$(docker inspect --format='{{json .State.Health.Status}}' fullprep-backend)" != "\"healthy\"" ]; then
            echo "❌ Services failed to start or report healthy."
            docker compose logs
            exit 1
          fi

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: ./frontend

      - name: Install Playwright Browsers and System Dependencies
        run: npx playwright install --with-deps
        working-directory: ./frontend

      - name: Run Playwright E2E Integration Suite
        run: npm run test:e2e
        working-directory: ./frontend
        env:
          BASE_URL: http://localhost:3000

      - name: Stop Services & Cleanup Volumes
        if: always()
        run: docker compose down -v

      - name: Upload Playwright Reports on Test Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

  # ==============================================================================
  # Job 6: Docker Images Build & Push
  # ==============================================================================
  docker-publish:
    name: Build & Push Production Docker Images
    runs-on: ubuntu-latest
    needs: [e2e-integration]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Frontend Image Metadata & Push ---
      - name: Extract Frontend Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # --- Backend Image Metadata & Push ---
      - name: Extract Backend Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ==============================================================================
  # Job 7: Deploy to Production
  # ==============================================================================
  deploy:
    name: Deploy to Production Environments
    runs-on: ubuntu-latest
    needs: [docker-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # --- Deploy Backend to AWS ECS (if AWS_ENABLED) ---
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.AWS_ACCESS_KEY_ID != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Images to Amazon ECR & Deploy ECS Service
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest ${{ steps.login-ecr.outputs.registry }}/fullprep-backend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/fullprep-backend:latest
          aws ecs update-service --cluster fullprep-cluster --service fullprep-backend --force-new-deployment
          # Wait for backend service stability
          aws ecs wait services-stable --cluster fullprep-cluster --services fullprep-backend

      # --- Deploy Frontend to Vercel ---
      - name: Setup Node.js
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel@latest

      - name: Deploy Frontend Production Build to Vercel
        if: env.VERCEL_TOKEN != ''
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}
          vercel build --prod --token=${{ env.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }}

  # ==============================================================================
  # Job 8: Notification (Slack)
  # ==============================================================================
  notify:
    name: Send Build Notifications
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Status Update to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            FullPrep CI/CD Build Result: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
