<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="FullPrep"
>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D1225" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="46%">
      <stop offset="0%"   stop-color="#FF6B00" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"    />
    </radialGradient>
    <linearGradient
      id="brandGrad"
      x1="108"  y1="140"
      x2="404"  y2="372"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%"   stop-color="#FF9A50" />
      <stop offset="45%"  stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E85A00" />
    </linearGradient>
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="115" ry="115" />
    </clipPath>
  </defs>

  <!-- Squircle base background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" />

  <!-- Warm ambient radial glow -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#ambientGlow)" clip-path="url(#squircleClip)" />

  <!-- Glass edge shimmer -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="114" ry="114" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />

  <!-- Left angle bracket < -->
  <polyline points="185,152 108,256 185,360" fill="none" stroke="url(#brandGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Forward slash / -->
  <line x1="240" y1="372" x2="272" y2="140" stroke="url(#brandGrad)" stroke-width="40" stroke-linecap="round" />

  <!-- Right angle bracket > -->
  <polyline points="327,152 404,256 327,360" fill="none" stroke="url(#brandGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

</svg>
